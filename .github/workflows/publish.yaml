name: Publish

on:
  push:
    branches:
      - main
      - release
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - name: Set NPM variables
        id: npm
        run: |
          BRANCH=${GITHUB_REF##*/}
          DIST_TAG=rc
          if [[ $BRANCH == "release" ]]; then
            DIST_TAG=latest
          fi
          echo "dist_tag=${DIST_TAG}" >> $GITHUB_OUTPUT

          pnpm config list
      - name: Install
        run: pnpm install
      - name: Build
        run: pnpm build
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      - name: Release Summary
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo "### New version v${{ steps.semantic.outputs.new_release_version }} cut" >> $GITHUB_STEP_SUMMARY
          echo "commit: ${GITHUB_SHA}, branch/tag: ${GITHUB_REF}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.semantic.outputs.new_release_notes }}" >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      - name: NPM Publish
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          ./scripts/update-version.sh ${{ steps.semantic.outputs.new_release_version }}
          pnpm publish --no-git-checks --access=public --tag ${{ steps.npm.outputs.dist_tag }}
      - name: report error
        if: steps.semantic.outputs.new_release_published == 'false'
        run: |
          echo "### No version cut" >> $GITHUB_STEP_SUMMARY
          echo "Check Semantic Release output for details"
