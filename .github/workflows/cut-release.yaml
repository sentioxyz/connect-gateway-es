name: Cut Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit to be cut to final released, default to head'
        required: false
        default: ''
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.commit }}
      - name: Sync Release Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git log -1
          git push origin HEAD:refs/heads/release
          gh workflow run publish.yaml --ref release
